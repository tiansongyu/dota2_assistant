[package]
name = "dpda-vision"
version = "0.1.0"
edition = "2024"

[features]
default = ["opencv-backend"]
opencv-backend = ["dep:opencv"]

[dependencies]
dpda-capture = { path = "../capture" }
dpda-draft-state = { path = "../draft-state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
opencv = { version = "=0.101.1", optional = true, default-features = false, features = ["clang-runtime", "imgproc", "imgcodecs"] }

[dev-dependencies]
tempfile = "3"

