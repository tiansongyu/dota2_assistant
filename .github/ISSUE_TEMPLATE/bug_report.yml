name: 缺陷报告
description: 报告可复现的问题，不附私人数据
body:
  - type: textarea
    id: behavior
    attributes:
      label: 实际行为与期望行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请附 commit/version、操作系统、DPI、游戏分辨率和窗口模式；不要公开令牌或个人数据库。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已去除敏感信息的错误与验证
