name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libopencv-dev clang libclang-dev pkg-config
      - name: Rust toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix apps/desktop
      - name: Cache pinned game icon snapshot
        uses: actions/cache@v5
        with:
          path: assets/game-icons
          key: ${{ runner.os }}-game-icons-v2-${{ hashFiles('assets/game-icons.snapshot.json', 'assets/game-icons.lock.json') }}
      - name: Restore and verify pinned game icon snapshot
        env:
          PYTHONUTF8: "1"
        run: python3 scripts/fetch-locked-game-icons.py
      - name: Verify locked offline assets and explicit missing entries
        run: npm --prefix apps/desktop run assets:verify -- --require-lock
      - run: npm --prefix apps/desktop run test:assets
      - run: scripts/check.sh
      - name: Steam account UI state regression (synthetic IPC)
        run: npm --prefix apps/desktop run test:steam
        env:
          DPDA_CHROME_PATH: /usr/bin/google-chrome
      - name: Verify production static asset copy
        run: npm --prefix apps/desktop run assets:verify -- --check-dist --require-lock
      - name: Build independent Linux API diagnostic binary
        run: cargo build --locked --release -p dpda-debug
      - name: Collect dependency licenses
        run: python3 scripts/collect-licenses.py --strict-normal --output artifacts/THIRD_PARTY_LICENSES.txt
      - name: Package developer diagnostic tool
        run: |
          mkdir -p artifacts/dpda-linux-debug
          cp target/release/dpda-debug LICENSE docs/linux-debug.md artifacts/THIRD_PARTY_LICENSES.txt artifacts/dpda-linux-debug/
          tar -czf artifacts/dpda-linux-debug-x86_64.tar.gz -C artifacts dpda-linux-debug
          cd artifacts
          sha256sum dpda-linux-debug-x86_64.tar.gz > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dpda-linux-debug
          path: |
            artifacts/dpda-linux-debug-x86_64.tar.gz
            artifacts/SHA256SUMS-linux.txt
      - name: Preserve icon coverage manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-icons-manifest-linux
          path: assets/game-icons/manifest.json
          if-no-files-found: ignore
