name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install official OpenCV 4.11.0 prebuilt libraries
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'opencv.exe'
          Invoke-WebRequest 'https://github.com/opencv/opencv/releases/download/4.11.0/opencv-4.11.0-windows.exe' -OutFile $archive
          $expected = '7c9d1c0b70db1b1952cc815252fced9a07f51267563cf3eaa1674d734c49b8e4'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'OpenCV archive checksum mismatch' }
          & 7z x $archive "-o$env:RUNNER_TEMP" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'OpenCV extraction failed' }
          $opencvRoot = Join-Path $env:RUNNER_TEMP 'opencv'
          "OPENCV_INCLUDE_PATHS=$opencvRoot\build\include" >> $env:GITHUB_ENV
          "OPENCV_LINK_PATHS=$opencvRoot\build\x64\vc16\lib" >> $env:GITHUB_ENV
          "OPENCV_LINK_LIBS=opencv_world4110" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "$opencvRoot\build\x64\vc16\bin" >> $env:GITHUB_PATH
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/runtime | Out-Null
          Copy-Item "$opencvRoot\build\x64\vc16\bin\opencv_world4110.dll" apps/desktop/src-tauri/runtime/
          Copy-Item "$opencvRoot\LICENSE.txt" apps/desktop/src-tauri/runtime/OpenCV-LICENSE.txt
          Copy-Item "$opencvRoot\build\etc\licenses" apps/desktop/src-tauri/runtime/opencv-licenses -Recurse
          $resources = @{ 'runtime/opencv_world4110.dll' = './opencv_world4110.dll'; 'runtime/OpenCV-LICENSE.txt' = './OpenCV-LICENSE.txt'; 'runtime/opencv-licenses/' = './opencv-licenses/' }
          @{ bundle = @{ resources = $resources } } | ConvertTo-Json -Depth 5 | Set-Content apps/desktop/src-tauri/bundle-windows.json
      - run: npm ci --prefix apps/desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm --prefix apps/desktop run typecheck
      - run: npm --prefix apps/desktop run lint
      - name: Build NSIS installer (unsigned development build)
        working-directory: apps/desktop
        run: npm run tauri -- build --config src-tauri/bundle-windows.json
      - name: Installer checksums
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content target/release/bundle/nsis/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dpda-windows-nsis-unsigned
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS-windows.txt
