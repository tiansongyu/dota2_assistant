name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install official OpenCV 4.11.0 prebuilt libraries
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'opencv.exe'
          Invoke-WebRequest 'https://github.com/opencv/opencv/releases/download/4.11.0/opencv-4.11.0-windows.exe' -OutFile $archive
          $expected = '7c9d1c0b70db1b1952cc815252fced9a07f51267563cf3eaa1674d734c49b8e4'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'OpenCV archive checksum mismatch' }
          & 7z x $archive "-o$env:RUNNER_TEMP" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'OpenCV extraction failed' }
          $opencvRoot = Join-Path $env:RUNNER_TEMP 'opencv'
          "OPENCV_INCLUDE_PATHS=$opencvRoot\build\include" >> $env:GITHUB_ENV
          "OPENCV_LINK_PATHS=$opencvRoot\build\x64\vc16\lib" >> $env:GITHUB_ENV
          "OPENCV_LINK_LIBS=opencv_world4110" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "$opencvRoot\build\x64\vc16\bin" >> $env:GITHUB_PATH
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/runtime | Out-Null
          Copy-Item "$opencvRoot\build\x64\vc16\bin\opencv_world4110.dll" apps/desktop/src-tauri/runtime/
          Copy-Item "$opencvRoot\LICENSE.txt" apps/desktop/src-tauri/runtime/OpenCV-LICENSE.txt
          Copy-Item "$opencvRoot\build\etc\licenses" apps/desktop/src-tauri/runtime/opencv-licenses -Recurse
          $resources = @{ 'runtime/opencv_world4110.dll' = './opencv_world4110.dll'; 'runtime/OpenCV-LICENSE.txt' = './OpenCV-LICENSE.txt'; 'runtime/opencv-licenses/' = './opencv-licenses/'; 'runtime/THIRD_PARTY_LICENSES.txt' = './THIRD_PARTY_LICENSES.txt'; 'runtime/DPDA-LICENSE.txt' = './DPDA-LICENSE.txt' }
          @{ bundle = @{ resources = $resources } } | ConvertTo-Json -Depth 5 | Set-Content apps/desktop/src-tauri/bundle-windows.json
      - run: npm ci --prefix apps/desktop
      - name: Cache pinned game icon snapshot
        uses: actions/cache@v5
        with:
          path: assets/game-icons
          key: ${{ runner.os }}-game-icons-v2-${{ hashFiles('assets/game-icons.snapshot.json', 'assets/game-icons.lock.json') }}
      - name: Restore and verify pinned game icon snapshot
        env:
          PYTHONUTF8: "1"
        run: python scripts/fetch-locked-game-icons.py
      - name: Verify locked offline assets and explicit missing entries
        run: npm --prefix apps/desktop run assets:verify -- --require-lock
      - run: npm --prefix apps/desktop run test:assets
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: npm --prefix apps/desktop run typecheck
      - run: npm --prefix apps/desktop run lint
      - name: Collect dependency licenses
        shell: pwsh
        run: |
          python scripts/collect-licenses.py --strict-normal --output apps/desktop/src-tauri/runtime/THIRD_PARTY_LICENSES.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency notice collection failed' }
          Copy-Item LICENSE apps/desktop/src-tauri/runtime/DPDA-LICENSE.txt
      - name: Build NSIS installer (unsigned development build)
        working-directory: apps/desktop
        run: npm run tauri -- build --config src-tauri/bundle-windows.json
      - name: Verify production static asset copy
        run: npm --prefix apps/desktop run assets:verify -- --check-dist --require-lock
      - name: Install and launch on CI runner (not a clean-PC or game test)
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $installDirectory = Join-Path $env:RUNNER_TEMP 'dpda-install-smoke'
          $setup = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$installDirectory") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited $($setup.ExitCode)" }
          if (!(Test-Path "$installDirectory\opencv_world4110.dll")) { throw 'Bundled OpenCV runtime is missing beside the executable' }
          $program = Join-Path $installDirectory 'dpda-desktop.exe'
          $process = Start-Process $program -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Installed application exited during startup: $($process.ExitCode)" }
          $process.CloseMainWindow() | Out-Null
          if (!$process.WaitForExit(5000)) { Stop-Process -Id $process.Id }
          Write-Output 'NSIS install and installed-process startup succeeded on the CI runner.'
      - name: Installer checksums
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content target/release/bundle/nsis/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dpda-windows-nsis-unsigned
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/SHA256SUMS-windows.txt
      - name: Preserve icon coverage manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-icons-manifest-windows
          path: assets/game-icons/manifest.json
          if-no-files-found: ignore
